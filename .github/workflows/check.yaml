name: EFM Build Check

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    name: Check Build
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Configure CMake Project
      run: cmake --preset x64-release -G "Visual Studio 17 2022"

    - name: Build CMake Project
      run: cmake --build --preset x64-release

    - name: Check modified Lua scripts
      run: |
        python -m pip install luaparser==4.2.0
        python tests/validate_modified_lua.py

    - name: Upload experimental EFM DLL
      uses: actions/upload-artifact@v4
      with:
        name: f22-efm-experimental
        path: bin/f22.dll
        if-no-files-found: error
