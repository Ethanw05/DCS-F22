name: EFM Build Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    name: Check Build
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Configure CMake Project
      run: cmake --preset x64-release -G "Visual Studio 17 2022"

    - name: Build CMake Project
      run: cmake --build --preset x64-release

    - name: Test Physics and Callbacks
      run: ctest --preset x64-release

    - name: Upload Experimental Windows EFM
      uses: actions/upload-artifact@v4
      with:
        name: experimental-f22-efm-win64
        if-no-files-found: error
        path: |
          bin/F22.dll
          LICENSE
          EFM/LICENSE
          docs/FLIGHT_MODEL.md

  physics-linux:
    name: Portable Physics and Sanitizers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B out/test -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
    - name: Build
      run: cmake --build out/test --parallel
    - name: Test
      run: ctest --test-dir out/test --output-on-failure
