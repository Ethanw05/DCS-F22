name: Import upstream source and assets

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-upstream.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-upstream
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      SOURCE_COMMIT: 8484b44cf8bc46540376435f0ba584f9f3e8bf44
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Import original source history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git remote add upstream https://github.com/grinnellidesigns/f-22a.git
          git fetch --no-tags upstream main
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          if git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD; then
            echo 'Source history already imported.'
          else
            git merge --no-commit --no-ff --allow-unrelated-histories "$SOURCE_COMMIT"
            # Keep workflow files unchanged in this automation commit.
            # Original workflows are restored separately through the connector.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit -m 'Import Grinnelli F-22A source with original history and attribution'
          fi

      - name: Download and verify original Git LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs fetch --all upstream
          git lfs fsck --objects

      - name: Transfer assets and publish source
        shell: bash
        run: |
          set -euo pipefail
          git lfs push --all origin
          git push origin HEAD:main
          echo 'Source history and Git LFS assets imported successfully.' >> "$GITHUB_STEP_SUMMARY"
